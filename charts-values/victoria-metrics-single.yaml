nameOverride: vms

server:
  fullnameOverride: victoria-metrics
  retentionPeriod: 7d
  extraArgs:
    opentelemetry.usePrometheusNaming: "true"
  persistentVolume:
    enabled: true
    storageClassName: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
