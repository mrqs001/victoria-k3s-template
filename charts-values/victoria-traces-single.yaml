nameOverride: vts

server:
  fullnameOverride: victoria-traces
  retentionPeriod: 7d
  extraArgs:
    servicegraph.enableTask: "true"
  persistentVolume:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
