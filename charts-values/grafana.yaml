adminUser: admin
adminPassword: admin

deploymentStrategy:
  type: Recreate

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

initChownData:
  enabled: false

plugins:
  - victoriametrics-metrics-datasource
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: vm
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://victoria-metrics-http:8428
        isDefault: true
      - name: VictoriaLogs
        uid: vl
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-http:9428
        jsonData:
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: vt
              url: '$${__value.raw}'
              urlDisplayLabel: View trace
          correlations:
            - targetUID: vt
              label: View trace
              description: Open trace by trace_id
              config:
                type: query
                field: trace_id
                target:
                  query: '$${trace_id}'
            - targetUID: vm
              label: View service metrics
              description: Open request metrics for the log service
              config:
                type: query
                field: service_name
                target:
                  expr: 'sum(rate({__name__=~"demo_.*_requests_total",service="$${service_name}"}[5m]))'
                  queryType: timeSeriesQuery
      - name: VictoriaTraces
        uid: vt
        type: jaeger
        access: proxy
        url: http://victoria-traces-http:10428/select/jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: vl
            spanStartTimeShift: '-30s'
            spanEndTimeShift: '30s'
            tags:
              - key: service.name
                value: service_name
            filterByTraceID: true
            filterBySpanID: false
            customQuery: true
            query: 'trace_id:="$${__trace.traceId}" AND span_id:="$${__trace.spanId}"'
          tracesToMetrics:
            datasourceUid: vm
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            tags:
              - key: service.name
                value: service
            queries:
              - name: Request rate
                query: 'sum(rate({__name__=~"demo_.*_requests_total",$$__tags}[5m]))'
              - name: Error rate
                query: 'sum(rate({__name__=~"demo_.*_requests_total",outcome="error",$$__tags}[5m]))'

sidecar:
  dashboards:
    enabled: true
    searchNamespace: null
